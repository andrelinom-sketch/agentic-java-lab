spring:
  application:
    name: agentic-java-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agenticlab}
    username: ${DB_USER:agenticlab}
    password: ${DB_PASSWORD:agenticlab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

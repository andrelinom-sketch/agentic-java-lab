# Permite que regras cujo alvo (ex.: pacote "account" ou "transfer") ainda não
# exista sejam avaliadas como satisfeitas (zero classes = zero violações), em
# vez de falhar por "should clause was empty". Isso evita que o ArchUnit force
# a criação prematura de pacotes/classes só para a régua ficar verde.
archRule.failOnEmptyShould=false

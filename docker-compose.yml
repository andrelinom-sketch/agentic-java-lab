# PostgreSQL para desenvolvimento local.
# A imagem deve ser a mesma usada em PostgresContainerConfig (testes).
# Credenciais descartáveis, apenas para uso local.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agenticlab
      POSTGRES_USER: agenticlab
      POSTGRES_PASSWORD: agenticlab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticlab -d agenticlab"]
      interval: 5s
      timeout: 3s
      retries: 10
